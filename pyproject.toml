[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r3a-ap0-runtime"
version = "0.1.0"
description = "R3A AP0 isolated institutional runtime"
requires-python = ">=3.12"
dependencies = ["psycopg[binary,pool]>=3.2,<4"]

[project.scripts]
r3a = "r3a_runtime.cli:main"

[tool.setuptools.packages.find]
include = ["r3a_runtime*", "r3a_plugins*"]

[tool.setuptools.package-data]
r3a_runtime = ["migrations/*.sql", "state_machines/*.json", "schemas/*.json", "residents/*.json"]
