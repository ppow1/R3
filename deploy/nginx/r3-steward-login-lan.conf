# R3 CONTROLLED NGINX CONFIGURATION
# File: deploy/nginx/r3-steward-login-lan.conf
# Component: R3A AP3 Remote Access / existing R3 account portal
# File Revision: 1.0.0
# Created: 2026-11-09T13:04:00Z
# Created By: Codex GPT-6
# Purpose: Restore the established LAN login endpoint by proxying to the existing account app.
# Authority: Steward directive AP3 Remote Access; coordinate Website #51 and Coordinator #56.
# Security: Bind only to 192.168.1.155; allow only 192.168.1.0/24; exact mutation Origin.
# Security: Clear Secure only on the two named portal cookies on this HTTP-only LAN listener; retain HttpOnly/SameSite.
# Changed: 2026-11-09T13:04:00Z | AP3-M1 | Codex GPT-6 | Add dedicated reversible LAN portal listener.
# Changed: 2026-11-09T14:30:00Z | AP3-M1 | Codex GPT-6 | Apply named-cookie Secure exception on LAN HTTP listener.
# Supersedes: None.
# History/Predecessor: New file; initial publication recorded in Git.

# Bind only to the R3 host's LAN IPv4 address. Do not expose this listener publicly.
map "$request_method|$http_origin" $r3a_login_invalid_origin {
    default 1;
    ~^(GET|HEAD|OPTIONS)\| 0;
    ~^(POST|PUT|PATCH|DELETE)\|http://192\.168\.1\.155:8303$ 0;
}

server {
    listen 192.168.1.155:8303;
    server_name 192.168.1.155;

    allow 192.168.1.0/24;
    deny all;

    if ($riverview_valid_host = 0) { return 444; }
    if ($r3a_login_invalid_origin) { return 403; }

    client_max_body_size 32k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    location / {
        proxy_pass http://127.0.0.1:18303;
        # The upstream issues Secure cookies for HTTPS. This listener is the
        # exact authorized HTTP LAN exception; keep other flags and cookies intact.
        proxy_cookie_flags rv_account_session nosecure;
        proxy_cookie_flags rv_account_csrf nosecure;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
