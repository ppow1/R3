name: R3 HR unit tests
on:
  push:
    branches:
      - engineering/hr-foundation-grace-marie-20261105
  pull_request:
    paths:
      - 'runtime/hr_*.py'
      - 'tests/test_hr*.py'
      - 'config/hr.json'
      - '.github/workflows/hr-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: HR regression tests
        run: python -m unittest discover -s tests -p 'test_hr*.py' -v
