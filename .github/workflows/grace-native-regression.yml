name: Grace native regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  grace-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native identity, authority, resources and execution
        run: |
          python -m unittest -v \
            tests.test_capabilities \
            tests.test_capability_authority \
            tests.test_grant_management \
            tests.test_resident_identity \
            tests.test_real_authority_tool_roundtrip \
            tests.test_grace_r3_independence \
            tests.test_resource_registry \
            tests.test_grace_native_capabilities \
            tests.test_resident_personnel \
            tests.test_governed_tools \
            tests.test_native_governed_client \
            tests.test_native_tools \
            tests.test_tool_server
