<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riverview 3</title>
<style>
:root{--panel-opacity:.45}
*{box-sizing:border-box}
body{margin:0;background:#091522;color:#edf4fc;font:15px system-ui,sans-serif;overflow:hidden}
#estate{position:fixed;inset:0;background:#152635 url('/api/v1/visual/background') center center/cover no-repeat}
#estate:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,12,23,.3),transparent 70%);pointer-events:none}
.controls{position:fixed;bottom:20px;left:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:rgba(8,18,30,.85);border-radius:12px;z-index:20}
input[type=range]{width:180px;accent-color:#8fb9ec}
button{cursor:pointer;border:1px solid #7794b1;color:#eaf4ff;background:#223b54;border-radius:7px;padding:7px 12px}
.window{position:absolute;left:12%;top:19%;width:min(740px,76vw);height:min(430px,60vh);min-width:320px;min-height:180px;resize:both;overflow:auto;background:rgba(12,25,42,var(--panel-opacity));border:1px solid rgba(205,227,255,.55);border-radius:14px;box-shadow:0 18px 50px #0008;z-index:5}
.window header{padding:15px 19px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #c2d5ec55;cursor:move;user-select:none;touch-action:none}
.window header b{font-size:20px}
.window header button{margin-left:auto}
.content{padding:20px}
.content h2{margin:0 0 12px;font-size:20px}
.status-message{margin:0 0 14px;line-height:1.5;color:#cfdeef}
.status-list{display:grid;gap:10px;margin:0 0 14px}
.status-card{padding:11px 13px;background:rgba(30,57,80,.65);border-radius:9px}
.status-card h3{font-size:14px;margin:0 0 6px}
.status-card p{margin:0;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.status-card ul{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.55}
.status-footnote{margin:12px 0 0;font-size:12px;line-height:1.45;color:#c0d0e2}
.window.min{height:52px!important;min-height:52px;width:240px!important;min-width:240px;resize:none;overflow:hidden}
.window.min .content{display:none}
.window.min header{height:50px;padding:9px 12px}
.window.min header b{font-size:15px;white-space:nowrap}
@media(max-width:650px){
 .window{left:4%;top:14%;width:92vw;height:56vh}
 .controls{left:4%;right:4%;bottom:12px}
}
</style>
</head>
<body>
<div id="estate" role="img" aria-label="Riverview 3 estate"></div>
<section class="window min" id="win" aria-label="Engineering Foundry">
  <header id="drag">
    <b>⚒ Engineering Foundry</b>
    <button id="minimize" aria-label="Restore panel">□</button>
  </header>
  <div class="content">
    <h2>Engineering status</h2>
    <p class="status-message" id="api-status" role="status" aria-live="polite">Loading current R3 state…</p>
    <div class="status-list">
      <section class="status-card" aria-labelledby="repo-title">
        <h3 id="repo-title">Repository</h3>
        <p id="repo-status">Checking</p>
      </section>
      <section class="status-card" aria-labelledby="branch-title">
        <h3 id="branch-title">Branches</h3>
        <ul id="branch-list"><li>Loading</li></ul>
      </section>
      <section class="status-card" aria-labelledby="worktree-title">
        <h3 id="worktree-title">Worktrees</h3>
        <ul id="worktree-list"><li>Loading</li></ul>
      </section>
    </div>
    <button id="refresh-status" type="button">Refresh status</button>
    <p class="status-footnote">Branch and worktree records do not establish that a worker is currently active.</p>
  </div>
</section>
<div class="controls">
  <label for="opacity">Panel opacity</label>
  <input id="opacity" type="range" min="45" max="95" value="45">
  <output id="value" for="opacity">45%</output>
  <button id="center-window" type="button">Center window</button>
</div>
<script>
const win=document.getElementById('win');
const slider=document.getElementById('opacity');
const value=document.getElementById('value');
const minimize=document.getElementById('minimize');
const centerButton=document.getElementById('center-window');
const refreshButton=document.getElementById('refresh-status');
const handle=document.getElementById('drag');
slider.oninput=()=>{document.documentElement.style.setProperty('--panel-opacity',slider.value/100);value.textContent=slider.value+'%';};
function clampPosition(x,y){
  const maxX=Math.max(0,innerWidth-win.offsetWidth);
  const maxY=Math.max(0,innerHeight-win.offsetHeight);
  win.style.left=Math.max(0,Math.min(maxX,x))+'px';
  win.style.top=Math.max(0,Math.min(maxY,y))+'px';
}
function centerWindow(){clampPosition((innerWidth-win.offsetWidth)/2,(innerHeight-win.offsetHeight)/2);}
const engineeringEntrance={x:.338,y:.837};
let expandedState=null;
function entrancePosition(){
  const imageWidth=1452,imageHeight=1024;
  const scale=Math.max(innerWidth/imageWidth,innerHeight/imageHeight);
  const drawnWidth=imageWidth*scale,drawnHeight=imageHeight*scale;
  return {x:(innerWidth-drawnWidth)/2+engineeringEntrance.x*drawnWidth,
          y:(innerHeight-drawnHeight)/2+engineeringEntrance.y*drawnHeight};
}
function placeMinimized(){const p=entrancePosition();clampPosition(p.x-win.offsetWidth/2,p.y-win.offsetHeight/2);}
function syncMinimizeButton(){
  const minimized=win.classList.contains('min');
  minimize.textContent=minimized?'□':'−';
  minimize.setAttribute('aria-label',minimized?'Restore panel':'Minimize panel');
}
function restorePanel(centerIfNew){
  win.classList.remove('min');
  slider.value=expandedState?expandedState.opacity:'82';
  slider.oninput();
  if(expandedState&&!centerIfNew){clampPosition(expandedState.left,expandedState.top);}
  else{centerWindow();}
}
minimize.addEventListener('click',e=>{
  e.stopPropagation();
  if(!win.classList.contains('min')){
    expandedState={left:win.offsetLeft,top:win.offsetTop,opacity:slider.value};
    win.classList.add('min');
    slider.value='45';
    slider.oninput();
    placeMinimized();
  }else{
    restorePanel(false);
  }
  syncMinimizeButton();
});
centerButton.addEventListener('click',()=>{
  if(win.classList.contains('min'))restorePanel(true);
  else centerWindow();
});
let drag=null;
handle.addEventListener('pointerdown',e=>{
  if(e.target.closest('button')||e.button!==0)return;
  e.preventDefault();
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,left:win.offsetLeft,top:win.offsetTop};
  handle.setPointerCapture(e.pointerId);
});
handle.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  clampPosition(drag.left+e.clientX-drag.x,drag.top+e.clientY-drag.y);
});
function endDrag(e){
  if(drag&&e.pointerId===drag.id){
    drag=null;
    if(handle.hasPointerCapture(e.pointerId))handle.releasePointerCapture(e.pointerId);
  }
}
handle.addEventListener('pointerup',endDrag);
handle.addEventListener('pointercancel',endDrag);
handle.addEventListener('lostpointercapture',()=>{drag=null;});
window.addEventListener('resize',()=>win.classList.contains('min')?placeMinimized():clampPosition(win.offsetLeft,win.offsetTop));

async function getJson(path){
  const response=await fetch(path,{cache:'no-store'});
  if(!response.ok)throw new Error('Request failed');
  return response.json();
}
function addListItem(list,text){
  const item=document.createElement('li');
  item.textContent=text;
  list.appendChild(item);
}
async function refreshEngineeringStatus(){
  const apiStatus=document.getElementById('api-status');
  const repoStatus=document.getElementById('repo-status');
  const branchList=document.getElementById('branch-list');
  const worktreeList=document.getElementById('worktree-list');
  apiStatus.textContent='Loading current R3 state…';
  repoStatus.textContent='Checking';
  branchList.replaceChildren();
  worktreeList.replaceChildren();
  try{
    const [health,branches,worktrees]=await Promise.all([
      getJson('/api/v1/health'),
      getJson('/api/v1/engineering/branches'),
      getJson('/api/v1/engineering/worktrees')
    ]);
    apiStatus.textContent='R3 service: '+(health.status||'status not reported');
    repoStatus.textContent='Repository '+(health.repository_present?'present':'not found')+
      '; artwork directory '+(health.artwork_directory_present?'present':'not found');
    if(branches.branches&&branches.branches.length){
      branches.branches.forEach(branch=>{
        const commit=(branch.commit||'').slice(0,8)||'commit not reported';
        addListItem(branchList,(branch.name||'unnamed branch')+' · '+commit);
      });
    }else addListItem(branchList,'No branch records reported');
    if(worktrees.worktrees&&worktrees.worktrees.length){
      worktrees.worktrees.forEach(tree=>{
        const commit=(tree.commit||'').slice(0,8)||'commit not reported';
        const state=tree.locked?' · locked':'';
        addListItem(worktreeList,(tree.branch||'detached')+' · '+commit+state);
      });
    }else addListItem(worktreeList,'No worktree records reported');
  }catch(error){
    apiStatus.textContent='R3 status unavailable';
    repoStatus.textContent='Unknown';
    addListItem(branchList,'Unknown');
    addListItem(worktreeList,'Unknown');
  }
}
refreshButton.addEventListener('click',refreshEngineeringStatus);
const background=new Image();
background.onload=()=>{};
background.onerror=()=>{};
background.src='/api/v1/visual/background';
slider.oninput();
placeMinimized();
refreshEngineeringStatus();
</script>
</body>
</html>
